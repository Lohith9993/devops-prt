---
- name: Setup devops-master
  hosts: master
  become: yes
  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Java
      apt:
        name: openjdk-17-jdk
        state: present

    - name: Add Jenkins GPG key
      apt_key:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key
        state: present

    - name: Add Jenkins repository
      apt_repository:
        repo: deb https://pkg.jenkins.io/debian-stable binary/
        state: present

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present
        update_cache: yes

    - name: Start Jenkins
      service:
        name: jenkins
        state: started
        enabled: yes

    - name: Install unzip
      apt:
        name: unzip
        state: present

    - name: Download Terraform
      get_url:
        url: https://releases.hashicorp.com/terraform/1.7.0/terraform_1.7.0_linux_amd64.zip
        dest: /tmp/terraform.zip

    - name: Install Terraform
      unarchive:
        src: /tmp/terraform.zip
        dest: /usr/local/bin/
        remote_src: yes
        mode: '0755'

    - name: Check Java version
      command: java -version
      register: java_out
    - debug:
        var: java_out.stderr

    - name: Check Jenkins status
      command: systemctl status jenkins
      register: jenkins_out
    - debug:
        var: jenkins_out.stdout_lines

    - name: Check Terraform version
      command: terraform version
      register: tf_out
    - debug:
        var: tf_out.stdout_lines
